<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Will or Going To? | English Game Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#091827;color:#f6f8ff;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:1350px;margin:auto;padding:3vw}.panel{background:#14314a;border:1px solid #63839c;border-radius:18px;padding:28px}h1{font-size:clamp(30px,4vw,55px)}.gold{color:#efc782;font-weight:bold}.layout{display:grid;grid-template-columns:1fr 250px;gap:18px;margin-top:20px}.question{font-size:clamp(23px,3vw,42px);margin:26px 0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.opt{background:#254962;border:2px solid #7495ad;border-radius:14px;padding:20px;font-size:clamp(18px,2vw,28px)}.correct{background:#176348;border-color:#5cdbb1}.wrong{opacity:.5}button{background:#285b7a;color:white;border:1px solid #8aabc1;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}.primary{background:#efc782;color:#162537}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none}.feedback{background:#19503f;padding:20px;border-radius:12px;margin-top:20px;font-size:21px}.timer{font-size:76px;color:#efc782;text-align:center}.team{display:flex;align-items:center;justify-content:space-between;margin:13px 0}.team button{padding:6px}.team strong{font-size:25px}.intro{max-width:900px;margin:8vh auto}.intro p{font-size:21px;line-height:1.7}@media(max-width:850px){.layout{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}</style></head><body><main><section id="intro" class="panel intro"><div class="gold">UNIT 6 · ENGLISH GAME HUB</div><h1>Will or Going To?</h1><h2>未來式雙門</h2><p>10 題 A／B 舉牌挑戰 · 25 秒倒數 · 教師控制 · 四組計分</p><button class="primary" onclick="start()">開始遊戲</button> <button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button></section><section id="game" class="hidden"><div class="gold">UNIT 6 · Will or Going To?</div><h1>未來式雙門</h1><div id="meta"></div><div class="layout"><div class="panel"><div class="gold" id="qno"></div><div class="question" id="question"></div><div class="opts" id="opts"></div><div class="feedback hidden" id="feedback"><strong id="answer"></strong><p id="why"></p></div><div class="actions"><button class="primary" id="reveal" onclick="reveal()">揭曉答案</button><button id="next" onclick="next()" disabled>下一題 →</button><button onclick="previous()">← 上一題</button><button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button><button onclick="restart()">重新開始</button></div></div><aside><div class="panel"><div class="gold">COUNTDOWN</div><div class="timer" id="timer">25</div><div class="actions"><button id="timerBtn" onclick="toggle()">▶ 開始</button><button onclick="resetTimer()">↻ 重設</button></div></div><br><div class="panel"><div class="gold">TEAM SCOREBOARD</div><div id="scores"></div><p>教師手動加減 10 分。</p></div></aside></div></section><section id="finish" class="panel intro hidden"><h1>CHALLENGE COMPLETE!</h1><div id="results"></div><button class="primary" onclick="restart()">再玩一次</button> <a style="color:#efc782;margin-left:15px" href="../../">返回首頁</a></section></main><script>const qs=[["選出正確的英文表達：",["I will visit her.","I will to visit her."],0,"正確形式：I will visit her.。"],["選出正確的英文表達：",["She is going buy a coat.","She is going to buy a coat."],1,"正確形式：She is going to buy a coat.。"],["選出正確的英文表達：",["They are going to travel.","They is going to travel."],0,"正確形式：They are going to travel.。"],["選出正確的英文表達：",["Are you will open the door?","Will you open the door?"],1,"正確形式：Will you open the door?。"],["選出正確的英文表達：",["He will be a doctor.","He will to be a doctor."],0,"正確形式：He will be a doctor.。"],["選出正確的英文表達：",["She willn't go tonight.","She won't go tonight."],1,"正確形式：She won't go tonight.。"],["選出正確的英文表達：",["I am going to study.","I am going study."],0,"正確形式：I am going to study.。"],["選出正確的英文表達：",["We will leaving soon.","We will leave soon."],1,"正確形式：We will leave soon.。"],["選出正確的英文表達：",["He is going to cook.","He is going cooking."],0,"正確形式：He is going to cook.。"],["選出正確的英文表達：",["There will to be a show.","There will be a show."],1,"正確形式：There will be a show.。"]];let i=0,shown=false,sec=25,ticker=null,score=[0,0,0,0];const el=x=>document.getElementById(x);function screen(x){["intro","game","finish"].forEach(k=>el(k).classList.toggle("hidden",k!==x))}function start(){i=0;score=[0,0,0,0];screen("game");render()}function render(){pause();sec=25;shown=false;let q=qs[i];el("meta").textContent="QUESTION "+(i+1)+" / 10";el("qno").textContent="QUESTION "+(i+1);el("question").textContent=q[0];el("opts").innerHTML=q[1].map((x,j)=>'<div class="opt" id="opt'+j+'"><b>'+String.fromCharCode(65+j)+'. </b>'+x+'</div>').join("");el("feedback").classList.add("hidden");el("reveal").disabled=false;el("next").disabled=true;el("next").textContent=i===9?"查看結算 →":"下一題 →";el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始";scores()}function reveal(){if(shown)return;shown=true;pause();let q=qs[i];el("opt"+q[2]).classList.add("correct");el("opt"+(1-q[2])).classList.add("wrong");el("answer").textContent="正確答案："+String.fromCharCode(65+q[2])+" · "+q[1][q[2]];el("why").textContent=q[3];el("feedback").classList.remove("hidden");el("reveal").disabled=true;el("next").disabled=false}function next(){if(!shown)return;if(i===9){finish();return}i++;render()}function previous(){if(i>0){i--;render()}}function scores(){el("scores").innerHTML=score.map((x,j)=>'<div class="team">Team '+(j+1)+' <button onclick="adjust('+j+',-10)">−</button><strong>'+x+'</strong><button onclick="adjust('+j+',10)">＋</button></div>').join("")}function adjust(j,v){score[j]=Math.max(0,Math.min(100,score[j]+v));scores()}function pause(){clearInterval(ticker);ticker=null;el("timerBtn").textContent="▶ 繼續"}function toggle(){if(ticker){pause();return}if(sec===0)sec=25;el("timerBtn").textContent="Ⅱ 暫停";ticker=setInterval(()=>{sec--;el("timer").textContent=sec;if(sec<=0)pause()},1000)}function resetTimer(){pause();sec=25;el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始"}function finish(){pause();screen("finish");const m=Math.max(...score);el("results").innerHTML=score.map((v,j)=>'<p style="font-size:25px">Team '+(j+1)+'：'+v+' / 100 '+(v===m&&m>0?"🏆":"")+'</p>').join("")}function restart(){if(confirm("重新開始會清除分數，確定嗎？"))start()}document.addEventListener("keydown",e=>{if(el("game").classList.contains("hidden"))return;if(e.code==="Space"&&!["BUTTON","INPUT"].includes(document.activeElement.tagName)){e.preventDefault();shown?next():reveal()}if(e.key.toLowerCase()==="p")toggle()});</script></body></html>
