rid-template-columns:1fr}}</style></head><body><main><section id="intro" class="panel intro"><div class="gold">UNIT 2 · ENGLISH GAME HUB</div><h1>When It Happens</h1><h2>時間連接戰</h2><p>10 題 A／B 舉牌挑戰，教師控制答案揭曉、25 秒倒數與六組計分。</p><button class="primary" onclick="start()">開始遊戲 ▶</button> <button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button><p class="note">依文法宅急通重點設計的延伸題。</p></section><section id="game" class="hidden"><div class="gold">UNIT 2 · When It Happens</div><h1>時間連接戰</h1><div id="meta"></div><div class="bar"><div id="progress"></div></div><div class="layout"><div class="panel"><div class="gold" id="qno"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback hidden" id="feedback"><strong id="answer"></strong><p id="why"></p></div><div class="actions"><button class="primary" id="reveal" onclick="reveal()">揭曉答案</button><button id="next" onclick="next()" disabled>下一題 →</button><button onclick="previous()">← 上一題</button><button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button><button onclick="restart()">重新開始</button></div></div><aside><div class="panel"><div class="gold">COUNTDOWN</div><div class="timer" id="timer">25</div><div class="actions"><button id="timerBtn" onclick="toggle()">▶ 開始</button><button onclick="resetTimer()">↻ 重設</button></div></div><br><div class="panel"><div class="gold">TEAM SCOREBOARD</div><div id="scores"></div><p class="note">教師手動計分；重新整理不保留。</p></div></aside></div></section><section id="finish" class="panel intro hidden"><div class="gold">MISSION COMPLETE</div><h1>CHALLENGE COMPLETE!</h1><div id="results"></div><button class="primary" onclick="restart()">再玩一次</button> <a href="../../" style="color:#efc781;margin-left:20px">返回首頁</a></section></main><script>const qs=[["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["When I got home, Mom was cooking.","because I got home Mom was cooking."],0,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「When I got home, Mom was cooking.」；另一選項「because I got home Mom was cooking.」錯在：「because I got home Mom was cooking.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["I smiled because I saw her.","I smiled when I saw her."],1,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「I smiled when I saw her.」；另一選項「I smiled because I saw her.」錯在：「I smiled because I saw her.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["When the bell rang, we were reading.","because the bell rang we were reading."],0,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「When the bell rang, we were reading.」；另一選項「because the bell rang we were reading.」錯在：「because the bell rang we were reading.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["because I have time I play soccer.","When I have time, I play soccer."],1,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「When I have time, I play soccer.」；另一選項「because I have time I play soccer.」錯在：「because I have time I play soccer.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["He was happy when he heard the news.","He was happy because he heard the news."],0,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「He was happy when he heard the news.」；另一選項「He was happy because he heard the news.」錯在：「He was happy because he heard the news.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["because I arrived she was studying.","When I arrived, she was studying."],1,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「When I arrived, she was studying.」；另一選項「because I arrived she was studying.」錯在：「because I arrived she was studying.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["I was reading when Dad called.","I was reading because Dad called."],0,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「I was reading when Dad called.」；另一選項「I was reading because Dad called.」錯在：「I was reading because Dad called.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["because school ended we went home.","When school ended, we went home."],1,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「When school ended, we went home.」；另一選項「because school ended we went home.」錯在：「because school ended we went home.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["When I saw him, I waved.","because I saw him I waved."],0,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「When I saw him, I waved.」；另一選項「because I saw him I waved.」錯在：「because I saw him I waved.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["I smiled because she arrived.","I smiled when she arrived."],1,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「I smiled when she arrived.」；另一選項「I smiled because she arrived.」錯在：「I smiled because she arrived.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"]];let i=0,shown=false,sec=25,ticker=null,score=[0,0,0,0,0,0];const el=x=>document.getElementById(x);function screen(x){["intro","game","finish"].forEach(k=>el(k).classList.toggle("hidden",k!==x))}function start(){i=0;score=[0,0,0,0,0,0];screen("game");render()}function render(){pause();sec=25;shown=false;let q=qs[i];el("meta").textContent="QUESTION "+(i+1)+" / 10";el("qno").textContent="QUESTION "+String(i+1).padStart(2,"0");el("progress").style.width=((i+1)*10)+"%";el("question").textContent=q[0];el("choices").innerHTML=q[1].map((x,j)=>'<div class="choice" id="opt'+j+'"><b>'+String.fromCharCode(65+j)+'. </b>'+x+'</div>').join("");el("feedback").classList.add("hidden");el("reveal").disabled=false;el("next").disabled=true;el("next").textContent=i===9?"查看結算 →":"下一題 →";el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始";scores()}function reveal(){if(shown)return;shown=true;pause();let q=qs[i];el("opt"+q[2]).classList.add("correct");el("opt"+(1-q[2])).classList.add("wrong");el("answer").textContent="正確答案："+String.fromCharCode(65+q[2])+" · "+q[1][q[2]];el("why").textContent=q[3];el("feedback").classList.remove("hidden");el("reveal").disabled=true;el("next").disabled=false}function next(){if(!shown)return;if(i===9){finish();return}i++;render()}function previous(){if(i>0){i--;render()}}function scores(){el("scores").innerHTML=score.map((x,j)=>'<div class="team">Team '+(j+1)+' <button onclick="adjust('+j+',-10)">−</button><strong>'+x+'</strong><button onclick="adjust('+j+',10)">＋</button></div>').join("")}function adjust(j,v){score[j]=Math.max(0,Math.min(100,score[j]+v));scores()}function pause(){clearInterval(ticker);ticker=null;el("timerBtn").textContent="▶ 繼續"}function toggle(){if(ticker){pause();return}if(sec===0)sec=25;el("timerBtn").textContent="Ⅱ 暫停";ticker=setInterval(()=>{sec--;el("timer").textContent=sec;if(sec<=0)pause()},1000)}function resetTimer(){pause();sec=25;el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始"}function finish(){pause();screen("finish");const m=Math.max(...score);el("results").innerHTML=score.map((v,j)=>'<p style="font-size:25px">Team '+(j+1)+'：'+v+' / 100 '+(v===m&&m>0?"🏆":"")+'</p>').join("")}function restart(){if(confirm("重新開始會清除分數，確定嗎？"))start()}document.addEventListener("keydown",e=>{if(el("game").classList.contains("hidden"))return;if(e.code==="Space"&&!["BUTTON","INPUT"].includes(document.activeElement.tagName)){e.preventDefault();shown?next():reveal()}if(e.key.toLowerCase()==="p")toggle()});</script></body></html>
