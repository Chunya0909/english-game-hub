<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U2 Unit 2 Final Boss | English Game Hub</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#234963,#081522 70%);color:#f5f8fc;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:1400px;margin:auto;padding:3vw}.panel{background:#10283f;border:1px solid #55758e;border-radius:18px;padding:clamp(20px,3vw,35px)}h1{font-size:clamp(30px,4vw,58px);margin:10px 0}.gold{color:#efc781;font-weight:800;letter-spacing:.08em}.layout{display:grid;grid-template-columns:1fr 250px;gap:18px;margin-top:20px}.question{font-size:clamp(22px,2.8vw,42px);font-weight:800;margin:24px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{background:#20445e;border:2px solid #68889e;border-radius:14px;padding:22px;font-size:clamp(18px,2vw,27px);min-height:90px}.choice b{color:#efc781}.correct{border-color:#50e0ad;background:#165641}.wrong{opacity:.5}.feedback{background:#164a3a;border-left:5px solid #50e0ad;padding:18px;margin-top:18px;border-radius:10px;font-size:20px}button{background:#28506d;color:white;border:1px solid #7797b0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:750;cursor:pointer}button:disabled{opacity:.4}.primary{background:#efc781;color:#152537;border:0}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.timer{font-size:74px;color:#efc781;text-align:center;font-weight:900}.team{display:flex;justify-content:space-between;align-items:center;gap:5px;margin:12px 0}.team button{padding:5px 9px}.team strong{font-size:24px}.hidden{display:none!important}.intro{max-width:950px;margin:7vh auto}.intro p{font-size:21px;line-height:1.7}.note{font-size:14px;color:#bbcfdd}.bar{height:8px;background:#28465f;border-radius:8px;overflow:hidden;margin-top:14px}.bar div{height:100%;background:#efc781}@media(max-width:850px){.layout{grid-template-columns:1fr}.choices{grid-template-columns:1fr}}</style></head><body><main><section id="intro" class="panel intro"><div class="gold">UNIT 2 · ENGLISH GAME HUB</div><h1>Unit 2 Final Boss</h1><h2>終極挑戰</h2><p>10 題 A／B 舉牌挑戰，教師控制答案揭曉、25 秒倒數與六組計分。</p><button class="primary" onclick="start()">開始遊戲 ▶</button> <button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button><p class="note">依文法宅急通重點設計的延伸題。</p></section><section id="game" class="hidden"><div class="gold">UNIT 2 · Unit 2 Final Boss</div><h1>終極挑戰</h1><div id="meta"></div><div class="bar"><div id="progress"></div></div><div class="layout"><div class="panel"><div class="gold" id="qno"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback hidden" id="feedback"><strong id="answer"></strong><p id="why"></p></div><div class="actions"><button class="primary" id="reveal" onclick="reveal()">揭曉答案</button><button id="next" onclick="next()" disabled>下一題 →</button><button onclick="previous()">← 上一題</button><button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button><button onclick="restart()">重新開始</button></div></div><aside><div class="panel"><div class="gold">COUNTDOWN</div><div class="timer" id="timer">25</div><div class="actions"><button id="timerBtn" onclick="toggle()">▶ 開始</button><button onclick="resetTimer()">↻ 重設</button></div></div><br><div class="panel"><div class="gold">TEAM SCOREBOARD</div><div id="scores"></div><p class="note">教師手動計分；重新整理不保留。</p></div></aside></div></section><section id="finish" class="panel intro hidden"><div class="gold">MISSION COMPLETE</div><h1>CHALLENGE COMPLETE!</h1><div id="results"></div><button class="primary" onclick="restart()">再玩一次</button> <a href="../../" style="color:#efc781;margin-left:20px">返回首頁</a></section></main><script>const qs=[["「club」是什麼意思？",["社團","學期"],0,"文法／詞義規則：「club」的意思是「社團」。正解「社團」；另一選項「學期」錯在：「學期」不是該詞組的正確翻譯。"],["「after」是什麼意思？",["在之前","在之後"],1,"文法／詞義規則：「after」的意思是「在之後」。正解「在之後」；另一選項「在之前」錯在：「在之前」不是該詞組的正確翻譯。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["When the bell rang, we were reading.","because the bell rang we were reading."],0,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「When the bell rang, we were reading.」；另一選項「because the bell rang we were reading.」錯在：「because the bell rang we were reading.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["「after dinner」是什麼意思？",["晚餐前","晚餐後"],1,"文法／詞義規則：「after dinner」的意思是「晚餐後」。正解「晚餐後」；另一選項「晚餐前」錯在：「晚餐前」不是該詞組的正確翻譯。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["When I got home, I rested.","because I got home I rested."],0,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「When I got home, I rested.」；另一選項「because I got home I rested.」錯在：「because I got home I rested.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出符合文法或詞義的正確表達：",["before took the test","before taking the test"],1,"文法／詞義規則：依教材的時間連接詞 when／before／after 與子句先後關係選擇。正解「before taking the test」；另一選項「before took the test」錯在：「before took the test」不符合本題指定的時間語意或句型。"],["選出符合文法或詞義的正確表達：",["They will leave before it gets dark.","They will leave before it will get dark."],0,"文法／詞義規則：描述未來時，when／before／after 引導的時間副詞子句通常用現在簡單式表示未來；主要子句可用 will。正解「They will leave before it gets dark.」；另一選項「They will leave before it will get dark.」錯在：「They will leave before it will get dark.」在時間子句內使用 will，不符合此教材所教的基本時間子句規則。"],["「miss」是什麼意思？",["贏得","錯過"],1,"文法／詞義規則：「miss」的意思是「錯過」。正解「錯過」；另一選項「贏得」錯在：「贏得」不是該詞組的正確翻譯。"],["選出能正確表達時間先後或同時發生的句子（不是考逗號）：",["When I saw him, I waved.","because I saw him I waved."],0,"文法／詞義規則：when 表「當……時」，before 表「在……之前」，after 表「在……之後」；時間子句置前常加逗號，置後通常不加。正解「When I saw him, I waved.」；另一選項「because I saw him I waved.」錯在：「because I saw him I waved.」使用 because（因為）改變了時間關係，不能表達指定時間順序。"],["選出符合文法或詞義的正確表達：",["I will buy a ticket before the show will start.","I will buy a ticket before the show starts."],1,"文法／詞義規則：描述未來時，when／before／after 引導的時間副詞子句通常用現在簡單式表示未來；主要子句可用 will。正解「I will buy a ticket before the show starts.」；另一選項「I will buy a ticket before the show will start.」錯在：「I will buy a ticket before the show will start.」在時間子句內使用 will，不符合此教材所教的基本時間子句規則。"]];let i=0,shown=false,sec=25,ticker=null,score=[0,0,0,0,0,0];const el=x=>document.getElementById(x);function screen(x){["intro","game","finish"].forEach(k=>el(k).classList.toggle("hidden",k!==x))}function start(){i=0;score=[0,0,0,0,0,0];screen("game");render()}function render(){pause();sec=25;shown=false;let q=qs[i];el("meta").textContent="QUESTION "+(i+1)+" / 10";el("qno").textContent="QUESTION "+String(i+1).padStart(2,"0");el("progress").style.width=((i+1)*10)+"%";el("question").textContent=q[0];el("choices").innerHTML=q[1].map((x,j)=>'<div class="choice" id="opt'+j+'"><b>'+String.fromCharCode(65+j)+'. </b>'+x+'</div>').join("");el("feedback").classList.add("hidden");el("reveal").disabled=false;el("next").disabled=true;el("next").textContent=i===9?"查看結算 →":"下一題 →";el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始";scores()}function reveal(){if(shown)return;shown=true;pause();let q=qs[i];el("opt"+q[2]).classList.add("correct");el("opt"+(1-q[2])).classList.add("wrong");el("answer").textContent="正確答案："+String.fromCharCode(65+q[2])+" · "+q[1][q[2]];el("why").textContent=q[3];el("feedback").classList.remove("hidden");el("reveal").disabled=true;el("next").disabled=false}function next(){if(!shown)return;if(i===9){finish();return}i++;render()}function previous(){if(i>0){i--;render()}}function scores(){el("scores").innerHTML=score.map((x,j)=>'<div class="team">Team '+(j+1)+' <button onclick="adjust('+j+',-10)">−</button><strong>'+x+'</strong><button onclick="adjust('+j+',10)">＋</button></div>').join("")}function adjust(j,v){score[j]=Math.max(0,Math.min(100,score[j]+v));scores()}function pause(){clearInterval(ticker);ticker=null;el("timerBtn").textContent="▶ 繼續"}function toggle(){if(ticker){pause();return}if(sec===0)sec=25;el("timerBtn").textContent="Ⅱ 暫停";ticker=setInterval(()=>{sec--;el("timer").textContent=sec;if(sec<=0)pause()},1000)}function resetTimer(){pause();sec=25;el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始"}function finish(){pause();screen("finish");const m=Math.max(...score);el("results").innerHTML=score.map((v,j)=>'<p style="font-size:25px">Team '+(j+1)+'：'+v+' / 100 '+(v===m&&m>0?"🏆":"")+'</p>').join("")}function restart(){if(confirm("重新開始會清除分數，確定嗎？"))start()}document.addEventListener("keydown",e=>{if(el("game").classList.contains("hidden"))return;if(e.code==="Space"&&!["BUTTON","INPUT"].includes(document.activeElement.tagName)){e.preventDefault();shown?next():reveal()}if(e.key.toLowerCase()==="p")toggle()});</script></body></html>
