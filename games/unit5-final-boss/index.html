<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 5 Final Boss | English Game Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#091827;color:#f6f8ff;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:1350px;margin:auto;padding:3vw}.panel{background:#14314a;border:1px solid #63839c;border-radius:18px;padding:28px}h1{font-size:clamp(30px,4vw,55px)}.gold{color:#efc782;font-weight:bold}.layout{display:grid;grid-template-columns:1fr 250px;gap:18px;margin-top:20px}.question{font-size:clamp(23px,3vw,42px);margin:26px 0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.opt{background:#254962;border:2px solid #7495ad;border-radius:14px;padding:20px;font-size:clamp(18px,2vw,28px)}.correct{background:#176348;border-color:#5cdbb1}.wrong{opacity:.5}button{background:#285b7a;color:white;border:1px solid #8aabc1;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}.primary{background:#efc782;color:#162537}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none}.feedback{background:#19503f;padding:20px;border-radius:12px;margin-top:20px;font-size:21px}.timer{font-size:76px;color:#efc782;text-align:center}.team{display:flex;align-items:center;justify-content:space-between;margin:13px 0}.team button{padding:6px}.team strong{font-size:25px}.intro{max-width:900px;margin:8vh auto}.intro p{font-size:21px;line-height:1.7}@media(max-width:850px){.layout{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}</style></head><body><main><section id="intro" class="panel intro"><div class="gold">UNIT 5 · ENGLISH GAME HUB</div><h1>Unit 5 Final Boss</h1><h2>終極挑戰</h2><p>10 題 A／B 舉牌挑戰 · 25 秒倒數 · 教師控制 · 六組計分</p><button class="primary" onclick="start()">開始遊戲</button> <button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button></section><section id="game" class="hidden"><div class="gold">UNIT 5 · Unit 5 Final Boss</div><h1>終極挑戰</h1><div id="meta"></div><div class="layout"><div class="panel"><div class="gold" id="qno"></div><div class="question" id="question"></div><div class="opts" id="opts"></div><div class="feedback hidden" id="feedback"><strong id="answer"></strong><p id="why"></p></div><div class="actions"><button class="primary" id="reveal" onclick="reveal()">揭曉答案</button><button id="next" onclick="next()" disabled>下一題 →</button><button onclick="previous()">← 上一題</button><button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button><button onclick="restart()">重新開始</button></div></div><aside><div class="panel"><div class="gold">COUNTDOWN</div><div class="timer" id="timer">25</div><div class="actions"><button id="timerBtn" onclick="toggle()">▶ 開始</button><button onclick="resetTimer()">↻ 重設</button></div></div><br><div class="panel"><div class="gold">TEAM SCOREBOARD</div><div id="scores"></div><p>教師手動加減 10 分。</p></div></aside></div></section><section id="finish" class="panel intro hidden"><h1>CHALLENGE COMPLETE!</h1><div id="results"></div><button class="primary" onclick="restart()">再玩一次</button> <a style="color:#efc782;margin-left:15px" href="../../">返回首頁</a></section></main><script>const qs=[["「metro」的意思是？",["捷運","輪船"],0,"文法／字彙規則：依題目所給的交通、方位或問路字詞判斷中文詞義。正確答案「捷運」；另一選項「輪船」不對，因為代表不同交通工具、方向或位置，不符合題目字詞。"],["「turn right」的意思是？",["左轉","右轉"],1,"文法／字彙規則：依題目所給的交通、方位或問路字詞判斷中文詞義。正確答案「右轉」；另一選項「左轉」不對，因為代表不同交通工具、方向或位置，不符合題目字詞。"],["「between」的意思是？",["在兩者之間","在下方"],0,"文法／字彙規則：依題目所給的交通、方位或問路字詞判斷中文詞義。正確答案「在兩者之間」；另一選項「在下方」不對，因為代表不同交通工具、方向或位置，不符合題目字詞。"],["選出正確的英文表達：",["by the train","by train"],1,"文法／字彙規則：依 Unit 5 的交通工具、問路方位、by + 交通工具及搭乘動詞的教材句型判斷。正確答案「by train」；另一選項「by the train」不對，因為與題目指定的詞義、交通方式或句型不符。"],["一般乘客搭計程車，選出符合意思的英文：",["The passenger takes a taxi.","The passenger drives a taxi."],0,"take a taxi 表搭乘計程車；drive a taxi 表駕駛計程車，與題目的一般乘客身分不符。"],["一般乘客登機，選出標準搭配：",["get on a plane","get under a plane"],0,"get on a plane 表示登機；get under a plane 表示到飛機下方，不是登機。get in a plane 在某些語境可能成立，不應當作絕對錯誤。"],["選出「搭火車」的標準 take 句型：",["We take the train there.","We take by train there."],0,"文法／字彙規則：take + a/the + 交通工具表示搭乘；by + 交通工具則不用 take。正確答案「We take the train there.」；另一選項「We take by train there.」不對，因為不符合題目指定的駕駛／乘坐身分或 take 句型。"],["「motorcycle」的意思是？",["公車","機車"],1,"文法／字彙規則：依題目所給的交通、方位或問路字詞判斷中文詞義。正確答案「機車」；另一選項「公車」不對，因為代表不同交通工具、方向或位置，不符合題目字詞。"],["選出表示「搭飛機」的標準交通方式片語（使用 by）：",["by plane","by a plane"],0,"文法／字彙規則：表示交通方式常用 by + 無冠詞交通工具；on foot 是步行；搭乘大眾運輸工具常用 on，乘坐汽車或計程車常用 in。正確答案「by plane」；另一選項「by a plane」不對，因為混用了 by 後的冠詞，或 on／in／on foot 的標準搭配。"],["選出正確的英文表達：",["We can walk there by foot.","We can walk there on foot."],1,"文法／字彙規則：依 Unit 5 的交通工具、問路方位、by + 交通工具及搭乘動詞的教材句型判斷。正確答案「We can walk there on foot.」；另一選項「We can walk there by foot.」不對，因為與題目指定的詞義、交通方式或句型不符。"]];let i=0,shown=false,sec=25,ticker=null,score=[0,0,0,0,0,0];const el=x=>document.getElementById(x);function screen(x){["intro","game","finish"].forEach(k=>el(k).classList.toggle("hidden",k!==x))}function start(){i=0;score=[0,0,0,0,0,0];screen("game");render()}function render(){pause();sec=25;shown=false;let q=qs[i];el("meta").textContent="QUESTION "+(i+1)+" / 10";el("qno").textContent="QUESTION "+(i+1);el("question").textContent=q[0];el("opts").innerHTML=q[1].map((x,j)=>'<div class="opt" id="opt'+j+'"><b>'+String.fromCharCode(65+j)+'. </b>'+x+'</div>').join("");el("feedback").classList.add("hidden");el("reveal").disabled=false;el("next").disabled=true;el("next").textContent=i===9?"查看結算 →":"下一題 →";el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始";scores()}function reveal(){if(shown)return;shown=true;pause();let q=qs[i];el("opt"+q[2]).classList.add("correct");el("opt"+(1-q[2])).classList.add("wrong");el("answer").textContent="正確答案："+String.fromCharCode(65+q[2])+" · "+q[1][q[2]];el("why").textContent=q[3];el("feedback").classList.remove("hidden");el("reveal").disabled=true;el("next").disabled=false}function next(){if(!shown)return;if(i===9){finish();return}i++;render()}function previous(){if(i>0){i--;render()}}function scores(){el("scores").innerHTML=score.map((x,j)=>'<div class="team">Team '+(j+1)+' <button onclick="adjust('+j+',-10)">−</button><strong>'+x+'</strong><button onclick="adjust('+j+',10)">＋</button></div>').join("")}function adjust(j,v){score[j]=Math.max(0,Math.min(100,score[j]+v));scores()}function pause(){clearInterval(ticker);ticker=null;el("timerBtn").textContent="▶ 繼續"}function toggle(){if(ticker){pause();return}if(sec===0)sec=25;el("timerBtn").textContent="Ⅱ 暫停";ticker=setInterval(()=>{sec--;el("timer").textContent=sec;if(sec<=0)pause()},1000)}function resetTimer(){pause();sec=25;el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始"}function finish(){pause();screen("finish");const m=Math.max(...score);el("results").innerHTML=score.map((v,j)=>'<p style="font-size:25px">Team '+(j+1)+'：'+v+' / 100 '+(v===m&&m>0?"🏆":"")+'</p>').join("")}function restart(){if(confirm("重新開始會清除分數，確定嗎？"))start()}document.addEventListener("keydown",e=>{if(el("game").classList.contains("hidden"))return;if(e.code==="Space"&&!["BUTTON","INPUT"].includes(document.activeElement.tagName)){e.preventDefault();shown?next():reveal()}if(e.key.toLowerCase()==="p")toggle()});</script></body></html>
