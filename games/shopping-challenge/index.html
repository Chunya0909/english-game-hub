<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Challenge | English Game Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#091827;color:#f6f8ff;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:1350px;margin:auto;padding:3vw}.panel{background:#14314a;border:1px solid #63839c;border-radius:18px;padding:28px}h1{font-size:clamp(30px,4vw,55px)}.gold{color:#efc782;font-weight:bold}.layout{display:grid;grid-template-columns:1fr 250px;gap:18px;margin-top:20px}.question{font-size:clamp(23px,3vw,42px);margin:26px 0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.opt{background:#254962;border:2px solid #7495ad;border-radius:14px;padding:20px;font-size:clamp(18px,2vw,28px)}.correct{background:#176348;border-color:#5cdbb1}.wrong{opacity:.5}button{background:#285b7a;color:white;border:1px solid #8aabc1;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}.primary{background:#efc782;color:#162537}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none}.feedback{background:#19503f;padding:20px;border-radius:12px;margin-top:20px;font-size:21px}.timer{font-size:76px;color:#efc782;text-align:center}.team{display:flex;align-items:center;justify-content:space-between;margin:13px 0}.team button{padding:6px}.team strong{font-size:25px}.intro{max-width:900px;margin:8vh auto}.intro p{font-size:21px;line-height:1.7}@media(max-width:850px){.layout{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}</style></head><body><main><section id="intro" class="panel intro"><div class="gold">UNIT 6 · ENGLISH GAME HUB</div><h1>Shopping Challenge</h1><h2>購物挑戰</h2><p>10 題 A／B 舉牌挑戰 · 25 秒倒數 · 教師控制 · 六組計分</p><button class="primary" onclick="start()">開始遊戲</button> <button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button></section><section id="game" class="hidden"><div class="gold">UNIT 6 · Shopping Challenge</div><h1>購物挑戰</h1><div id="meta"></div><div class="layout"><div class="panel"><div class="gold" id="qno"></div><div class="question" id="question"></div><div class="opts" id="opts"></div><div class="feedback hidden" id="feedback"><strong id="answer"></strong><p id="why"></p></div><div class="actions"><button class="primary" id="reveal" onclick="reveal()">揭曉答案</button><button id="next" onclick="next()" disabled>下一題 →</button><button onclick="previous()">← 上一題</button><button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button><button onclick="restart()">重新開始</button></div></div><aside><div class="panel"><div class="gold">COUNTDOWN</div><div class="timer" id="timer">25</div><div class="actions"><button id="timerBtn" onclick="toggle()">▶ 開始</button><button onclick="resetTimer()">↻ 重設</button></div></div><br><div class="panel"><div class="gold">TEAM SCOREBOARD</div><div id="scores"></div><p>教師手動加減 10 分。</p></div></aside></div></section><section id="finish" class="panel intro hidden"><h1>CHALLENGE COMPLETE!</h1><div id="results"></div><button class="primary" onclick="restart()">再玩一次</button> <a style="color:#efc782;margin-left:15px" href="../../">返回首頁</a></section></main><script>const qs=[["「price」的意思是？",["價格","找零"],0,"文法／字彙規則：「price」在本題的意思是「價格」。正確答案是「價格」；另一選項「找零」不對，因為「找零」是另一個字詞的意思，不是 price 的正確翻譯。"],["「cost」的意思是？",["折扣","花費"],1,"文法／字彙規則：「cost」在本題的意思是「花費」。正確答案是「花費」；另一選項「折扣」不對，因為「折扣」是另一個字詞的意思，不是 cost 的正確翻譯。"],["「expensive」的意思是？",["昂貴","便宜"],0,"文法／字彙規則：「expensive」在本題的意思是「昂貴」。正確答案是「昂貴」；另一選項「便宜」不對，因為「便宜」是另一個字詞的意思，不是 expensive 的正確翻譯。"],["「cheap」的意思是？",["昂貴","便宜"],1,"文法／字彙規則：「cheap」在本題的意思是「便宜」。正確答案是「便宜」；另一選項「昂貴」不對，因為「昂貴」是另一個字詞的意思，不是 cheap 的正確翻譯。"],["「change」的意思是？",["找零","尺寸"],0,"文法／字彙規則：「change」在本題的意思是「找零」。正確答案是「找零」；另一選項「尺寸」不對，因為「尺寸」是另一個字詞的意思，不是 change 的正確翻譯。"],["「total」的意思是？",["折扣","總額"],1,"文法／字彙規則：「total」在本題的意思是「總額」。正確答案是「總額」；另一選項「折扣」不對，因為「折扣」是另一個字詞的意思，不是 total 的正確翻譯。"],["「sale」的意思是？",["特賣","試穿"],0,"文法／字彙規則：「sale」在本題的意思是「特賣」。正確答案是「特賣」；另一選項「試穿」不對，因為「試穿」是另一個字詞的意思，不是 sale 的正確翻譯。"],["「cash」的意思是？",["信用","現金"],1,"文法／字彙規則：「cash」在本題的意思是「現金」。正確答案是「現金」；另一選項「信用」不對，因為「信用」是另一個字詞的意思，不是 cash 的正確翻譯。"],["「size」的意思是？",["尺寸","價格"],0,"文法／字彙規則：「size」在本題的意思是「尺寸」。正確答案是「尺寸」；另一選項「價格」不對，因為「價格」是另一個字詞的意思，不是 size 的正確翻譯。"],["「pair」的意思是？",["一打","一雙"],1,"文法／字彙規則：「pair」在本題的意思是「一雙」。正確答案是「一雙」；另一選項「一打」不對，因為「一打」是另一個字詞的意思，不是 pair 的正確翻譯。"]];let i=0,shown=false,sec=25,ticker=null,score=[0,0,0,0,0,0];const el=x=>document.getElementById(x);function screen(x){["intro","game","finish"].forEach(k=>el(k).classList.toggle("hidden",k!==x))}function start(){i=0;score=[0,0,0,0,0,0];screen("game");render()}function render(){pause();sec=25;shown=false;let q=qs[i];el("meta").textContent="QUESTION "+(i+1)+" / 10";el("qno").textContent="QUESTION "+(i+1);el("question").textContent=q[0];el("opts").innerHTML=q[1].map((x,j)=>'<div class="opt" id="opt'+j+'"><b>'+String.fromCharCode(65+j)+'. </b>'+x+'</div>').join("");el("feedback").classList.add("hidden");el("reveal").disabled=false;el("next").disabled=true;el("next").textContent=i===9?"查看結算 →":"下一題 →";el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始";scores()}function reveal(){if(shown)return;shown=true;pause();let q=qs[i];el("opt"+q[2]).classList.add("correct");el("opt"+(1-q[2])).classList.add("wrong");el("answer").textContent="正確答案："+String.fromCharCode(65+q[2])+" · "+q[1][q[2]];el("why").textContent=q[3];el("feedback").classList.remove("hidden");el("reveal").disabled=true;el("next").disabled=false}function next(){if(!shown)return;if(i===9){finish();return}i++;render()}function previous(){if(i>0){i--;render()}}function scores(){el("scores").innerHTML=score.map((x,j)=>'<div class="team">Team '+(j+1)+' <button onclick="adjust('+j+',-10)">−</button><strong>'+x+'</strong><button onclick="adjust('+j+',10)">＋</button></div>').join("")}function adjust(j,v){score[j]=Math.max(0,Math.min(100,score[j]+v));scores()}function pause(){clearInterval(ticker);ticker=null;el("timerBtn").textContent="▶ 繼續"}function toggle(){if(ticker){pause();return}if(sec===0)sec=25;el("timerBtn").textContent="Ⅱ 暫停";ticker=setInterval(()=>{sec--;el("timer").textContent=sec;if(sec<=0)pause()},1000)}function resetTimer(){pause();sec=25;el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始"}function finish(){pause();screen("finish");const m=Math.max(...score);el("results").innerHTML=score.map((v,j)=>'<p style="font-size:25px">Team '+(j+1)+'：'+v+' / 100 '+(v===m&&m>0?"🏆":"")+'</p>').join("")}function restart(){if(confirm("重新開始會清除分數，確定嗎？"))start()}document.addEventListener("keydown",e=>{if(el("game").classList.contains("hidden"))return;if(e.code==="Space"&&!["BUTTON","INPUT"].includes(document.activeElement.tagName)){e.preventDefault();shown?next():reveal()}if(e.key.toLowerCase()==="p")toggle()});</script></body></html>
