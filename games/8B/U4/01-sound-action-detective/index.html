<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8B U4 Sound & Action Detective</title><style>*{box-sizing:border-box}body{margin:0;background:#091827;color:#f5f8fd;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:1400px;margin:auto;padding:3vw}.panel{background:#132d45;border:1px solid #66849a;border-radius:18px;padding:28px}h1{font-size:clamp(30px,4vw,58px)}.gold{color:#efc981;font-weight:800}.layout{display:grid;grid-template-columns:1fr 270px;gap:18px;margin-top:20px}.question{font-size:clamp(24px,3vw,43px);font-weight:800;margin:28px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{background:#244760;border:2px solid #7a98ac;border-radius:14px;padding:22px;font-size:clamp(19px,2vw,28px)}.correct{background:#165840;border-color:#58e3af}.wrong{opacity:.5}button{background:#2b5877;color:white;border:1px solid #8ba9be;border-radius:10px;padding:12px;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.primary{background:#efc981;color:#152638}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none}.feedback{background:#17513e;border-radius:12px;padding:20px;margin-top:20px;font-size:21px}.timer{font-size:76px;color:#efc981;text-align:center}.team{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:12px 0}.team button{padding:6px}.team strong{font-size:24px}.intro{max-width:950px;margin:7vh auto}.intro p{font-size:21px}@media(max-width:850px){.layout{grid-template-columns:1fr}.options{grid-template-columns:1fr}}</style></head><body><main><section id="intro" class="panel intro"><div class="gold">8B · UNIT 4</div><h1>Sound & Action Detective</h1><h2>聲音動作偵探</h2><p>10 題 · 六組手動計分 · 25 秒倒數 · 教師揭曉與解析</p><button class="primary" onclick="start()">開始遊戲</button> <button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button></section><section id="game" class="hidden"><div class="gold">8B · UNIT 4 · Sound & Action Detective</div><h1>聲音動作偵探</h1><div id="meta"></div><div class="layout"><div class="panel"><div class="gold" id="qno"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback hidden" id="feedback"><strong id="answer"></strong><p id="why"></p></div><div class="actions"><button class="primary" id="reveal" onclick="reveal()">揭曉答案</button><button id="next" onclick="next()" disabled>下一題 →</button><button onclick="previous()">← 上一題</button><button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button><button onclick="restart()">重新開始</button></div></div><aside><div class="panel"><div class="gold">COUNTDOWN</div><div class="timer" id="timer">25</div><div class="actions"><button id="timerBtn" onclick="toggle()">▶ 開始</button><button onclick="resetTimer()">↻ 重設</button></div></div><br><div class="panel"><div class="gold">TEAM SCOREBOARD</div><div id="scores"></div><p>教師手動加減 10 分。</p></div></aside></div></section><section id="finish" class="panel intro hidden"><h1>CHALLENGE COMPLETE!</h1><div id="results"></div><button class="primary" onclick="restart()">再玩一次</button> <a style="color:#efc981;margin-left:18px" href="../../../../">返回遊戲中心</a></section></main><script>const qs=[{"prompt":"「typhoon」的意思是？","options":["颱風","地震"],"correct":0,"why":"文法規則：依字彙的正確中文詞義判斷。正確答案「颱風」；另一選項「地震」是另一個不同的詞義。"},{"prompt":"「blow」的意思是？","options":["游泳","吹"],"correct":1,"why":"文法規則：依字彙的正確中文詞義判斷。正確答案「吹」；另一選項「游泳」是另一個不同的詞義。"},{"prompt":"「rose」的意思是？","options":["玫瑰","樹根"],"correct":0,"why":"文法規則：依字彙的正確中文詞義判斷。正確答案「玫瑰」；另一選項「樹根」是另一個不同的詞義。"},{"prompt":"「balcony」的意思是？","options":["地下室","陽台"],"correct":1,"why":"文法規則：依字彙的正確中文詞義判斷。正確答案「陽台」；另一選項「地下室」是另一個不同的詞義。"},{"prompt":"「wind」的意思是？","options":["風","雨"],"correct":0,"why":"文法規則：依字彙的正確中文詞義判斷。正確答案「風」；另一選項「雨」是另一個不同的詞義。"},{"prompt":"「storm」的意思是？","options":["晴天","暴風雨"],"correct":1,"why":"文法規則：依字彙的正確中文詞義判斷。正確答案「暴風雨」；另一選項「晴天」是另一個不同的詞義。"},{"prompt":"「thunder」的意思是？","options":["雷聲","陽光"],"correct":0,"why":"文法規則：依字彙的正確中文詞義判斷。正確答案「雷聲」；另一選項「陽光」是另一個不同的詞義。"},{"prompt":"「lightning」的意思是？","options":["彩虹","閃電"],"correct":1,"why":"文法規則：依字彙的正確中文詞義判斷。正確答案「閃電」；另一選項「彩虹」是另一個不同的詞義。"},{"prompt":"「shake」的意思是？","options":["搖晃","安靜"],"correct":0,"why":"文法規則：依字彙的正確中文詞義判斷。正確答案「搖晃」；另一選項「安靜」是另一個不同的詞義。"},{"prompt":"「hear」的意思是？","options":["看見","聽見"],"correct":1,"why":"文法規則：依字彙的正確中文詞義判斷。正確答案「聽見」；另一選項「看見」是另一個不同的詞義。"}];let i=0,shown=false,sec=25,ticker=null,score=[0,0,0,0,0,0];const el=x=>document.getElementById(x);function screen(x){["intro","game","finish"].forEach(k=>el(k).classList.toggle("hidden",k!==x))}function start(){i=0;score=[0,0,0,0,0,0];screen("game");render()}function render(){pause();sec=25;shown=false;let q=qs[i];el("meta").textContent="QUESTION "+(i+1)+" / 10";el("qno").textContent="QUESTION "+(i+1);el("question").textContent=q.prompt;el("options").innerHTML=q.options.map((x,j)=>'<div class="option" id="opt'+j+'"><b>'+String.fromCharCode(65+j)+'. </b>'+x+'</div>').join("");el("feedback").classList.add("hidden");el("reveal").disabled=false;el("next").disabled=true;el("next").textContent=i===9?"查看結算 →":"下一題 →";el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始";scores()}function reveal(){if(shown)return;shown=true;pause();let q=qs[i];el("opt"+q.correct).classList.add("correct");el("opt"+(1-q.correct)).classList.add("wrong");el("answer").textContent="正確答案："+String.fromCharCode(65+q.correct)+" · "+q.options[q.correct];el("why").textContent=q.why;el("feedback").classList.remove("hidden");el("reveal").disabled=true;el("next").disabled=false}function next(){if(!shown)return;if(i===9){finish();return}i++;render()}function previous(){if(i>0){i--;render()}}function scores(){el("scores").innerHTML=score.map((x,j)=>'<div class="team">Team '+(j+1)+' <button onclick="adjust('+j+',-10)">−</button><strong>'+x+'</strong><button onclick="adjust('+j+',10)">＋</button></div>').join("")}function adjust(j,v){score[j]=Math.max(0,Math.min(100,score[j]+v));scores()}function pause(){clearInterval(ticker);ticker=null;el("timerBtn").textContent="▶ 繼續"}function toggle(){if(ticker){pause();return}if(sec===0)sec=25;el("timerBtn").textContent="Ⅱ 暫停";ticker=setInterval(()=>{sec--;el("timer").textContent=sec;if(sec<=0)pause()},1000)}function resetTimer(){pause();sec=25;el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始"}function finish(){pause();screen("finish");const m=Math.max(...score);el("results").innerHTML=score.map((v,j)=>'<p style="font-size:25px">Team '+(j+1)+'：'+v+' / 100 '+(v===m&&m>0?"🏆":"")+'</p>').join("")}function restart(){if(confirm("重新開始會清除分數，確定嗎？"))start()}document.addEventListener("keydown",e=>{if(el("game").classList.contains("hidden"))return;if(e.code==="Space"&&!["BUTTON","INPUT"].includes(document.activeElement.tagName)){e.preventDefault();shown?next():reveal()}if(e.key.toLowerCase()==="p")toggle()});</script></body></html>
