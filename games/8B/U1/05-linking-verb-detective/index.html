<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8B U1 Linking Verb Detective</title><style>*{box-sizing:border-box}body{margin:0;background:#091827;color:#f5f8fd;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:1400px;margin:auto;padding:3vw}.panel{background:#132d45;border:1px solid #66849a;border-radius:18px;padding:28px}h1{font-size:clamp(30px,4vw,58px)}.gold{color:#efc981;font-weight:800}.layout{display:grid;grid-template-columns:1fr 270px;gap:18px;margin-top:20px}.question{font-size:clamp(24px,3vw,43px);font-weight:800;margin:28px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{background:#244760;border:2px solid #7a98ac;border-radius:14px;padding:22px;font-size:clamp(19px,2vw,28px)}.correct{background:#165840;border-color:#58e3af}.wrong{opacity:.5}button{background:#2b5877;color:white;border:1px solid #8ba9be;border-radius:10px;padding:12px;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.primary{background:#efc981;color:#152638}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none}.feedback{background:#17513e;border-radius:12px;padding:20px;margin-top:20px;font-size:21px}.timer{font-size:76px;color:#efc981;text-align:center}.team{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:12px 0}.team button{padding:6px}.team strong{font-size:24px}.intro{max-width:950px;margin:7vh auto}.intro p{font-size:21px}@media(max-width:850px){.layout{grid-template-columns:1fr}.options{grid-template-columns:1fr}}</style></head><body><main><section id="intro" class="panel intro"><div class="gold">8B · UNIT 1</div><h1>Linking Verb Detective</h1><h2>連綴動詞偵探</h2><p>10 題 · 六組手動計分 · 25 秒倒數 · 教師揭曉與解析</p><button class="primary" onclick="start()">開始遊戲</button> <button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button></section><section id="game" class="hidden"><div class="gold">8B · UNIT 1 · Linking Verb Detective</div><h1>連綴動詞偵探</h1><div id="meta"></div><div class="layout"><div class="panel"><div class="gold" id="qno"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback hidden" id="feedback"><strong id="answer"></strong><p id="why"></p></div><div class="actions"><button class="primary" id="reveal" onclick="reveal()">揭曉答案</button><button id="next" onclick="next()" disabled>下一題 →</button><button onclick="previous()">← 上一題</button><button onclick="document.documentElement.requestFullscreen?.()">全螢幕</button><button onclick="restart()">重新開始</button></div></div><aside><div class="panel"><div class="gold">COUNTDOWN</div><div class="timer" id="timer">25</div><div class="actions"><button id="timerBtn" onclick="toggle()">▶ 開始</button><button onclick="resetTimer()">↻ 重設</button></div></div><br><div class="panel"><div class="gold">TEAM SCOREBOARD</div><div id="scores"></div><p>教師手動加減 10 分。</p></div></aside></div></section><section id="finish" class="panel intro hidden"><h1>CHALLENGE COMPLETE!</h1><div id="results"></div><button class="primary" onclick="restart()">再玩一次</button> <a style="color:#efc981;margin-left:18px" href="../../../../">返回遊戲中心</a></section></main><script>const qs=[{"prompt":"選出正確答案：The steak tastes ___.","options":["delicious","deliciously"],"correct":0,"why":"文法規則：連綴動詞接形容詞；How 問感受，What ... like 問特徵。正解「delicious」；另一選項「deliciously」不符合本題的詞義或句型。"},{"prompt":"選出正確答案：The music sounds ___.","options":["beautifully","beautiful"],"correct":1,"why":"文法規則：連綴動詞接形容詞；How 問感受，What ... like 問特徵。正解「beautiful」；另一選項「beautifully」不符合本題的詞義或句型。"},{"prompt":"選出正確答案：The flower smells ___.","options":["sweet","sweetly"],"correct":0,"why":"文法規則：連綴動詞接形容詞；How 問感受，What ... like 問特徵。正解「sweet」；另一選項「sweetly」不符合本題的詞義或句型。"},{"prompt":"選出正確答案：He looks ___.","options":["tiredly","tired"],"correct":1,"why":"文法規則：連綴動詞接形容詞；How 問感受，What ... like 問特徵。正解「tired」；另一選項「tiredly」不符合本題的詞義或句型。"},{"prompt":"選出正確答案：The pillow feels ___.","options":["soft","softly"],"correct":0,"why":"文法規則：連綴動詞接形容詞；How 問感受，What ... like 問特徵。正解「soft」；另一選項「softly」不符合本題的詞義或句型。"},{"prompt":"選出正確答案：The soup tastes ___.","options":["saltily","salty"],"correct":1,"why":"文法規則：連綴動詞接形容詞；How 問感受，What ... like 問特徵。正解「salty」；另一選項「saltily」不符合本題的詞義或句型。"},{"prompt":"選出正確答案：Her idea sounds ___.","options":["great","greatly"],"correct":0,"why":"文法規則：連綴動詞接形容詞；How 問感受，What ... like 問特徵。正解「great」；另一選項「greatly」不符合本題的詞義或句型。"},{"prompt":"選出正確答案：The sky looks ___.","options":["darkly","dark"],"correct":1,"why":"文法規則：連綴動詞接形容詞；How 問感受，What ... like 問特徵。正解「dark」；另一選項「darkly」不符合本題的詞義或句型。"},{"prompt":"選出正確答案：The bread smells ___.","options":["good","well"],"correct":0,"why":"文法規則：連綴動詞接形容詞；How 問感受，What ... like 問特徵。正解「good」；另一選項「well」不符合本題的詞義或句型。"},{"prompt":"選出正確答案：The baby looks ___.","options":["happily","happy"],"correct":1,"why":"文法規則：連綴動詞接形容詞；How 問感受，What ... like 問特徵。正解「happy」；另一選項「happily」不符合本題的詞義或句型。"}];let i=0,shown=false,sec=25,ticker=null,score=[0,0,0,0,0,0];const el=x=>document.getElementById(x);function screen(x){["intro","game","finish"].forEach(k=>el(k).classList.toggle("hidden",k!==x))}function start(){i=0;score=[0,0,0,0,0,0];screen("game");render()}function render(){pause();sec=25;shown=false;let q=qs[i];el("meta").textContent="QUESTION "+(i+1)+" / 10";el("qno").textContent="QUESTION "+(i+1);el("question").textContent=q.prompt;el("options").innerHTML=q.options.map((x,j)=>'<div class="option" id="opt'+j+'"><b>'+String.fromCharCode(65+j)+'. </b>'+x+'</div>').join("");el("feedback").classList.add("hidden");el("reveal").disabled=false;el("next").disabled=true;el("next").textContent=i===9?"查看結算 →":"下一題 →";el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始";scores()}function reveal(){if(shown)return;shown=true;pause();let q=qs[i];el("opt"+q.correct).classList.add("correct");el("opt"+(1-q.correct)).classList.add("wrong");el("answer").textContent="正確答案："+String.fromCharCode(65+q.correct)+" · "+q.options[q.correct];el("why").textContent=q.why;el("feedback").classList.remove("hidden");el("reveal").disabled=true;el("next").disabled=false}function next(){if(!shown)return;if(i===9){finish();return}i++;render()}function previous(){if(i>0){i--;render()}}function scores(){el("scores").innerHTML=score.map((x,j)=>'<div class="team">Team '+(j+1)+' <button onclick="adjust('+j+',-10)">−</button><strong>'+x+'</strong><button onclick="adjust('+j+',10)">＋</button></div>').join("")}function adjust(j,v){score[j]=Math.max(0,Math.min(100,score[j]+v));scores()}function pause(){clearInterval(ticker);ticker=null;el("timerBtn").textContent="▶ 繼續"}function toggle(){if(ticker){pause();return}if(sec===0)sec=25;el("timerBtn").textContent="Ⅱ 暫停";ticker=setInterval(()=>{sec--;el("timer").textContent=sec;if(sec<=0)pause()},1000)}function resetTimer(){pause();sec=25;el("timer").textContent=sec;el("timerBtn").textContent="▶ 開始"}function finish(){pause();screen("finish");const m=Math.max(...score);el("results").innerHTML=score.map((v,j)=>'<p style="font-size:25px">Team '+(j+1)+'：'+v+' / 100 '+(v===m&&m>0?"🏆":"")+'</p>').join("")}function restart(){if(confirm("重新開始會清除分數，確定嗎？"))start()}document.addEventListener("keydown",e=>{if(el("game").classList.contains("hidden"))return;if(e.code==="Space"&&!["BUTTON","INPUT"].includes(document.activeElement.tagName)){e.preventDefault();shown?next():reveal()}if(e.key.toLowerCase()==="p")toggle()});</script></body></html>
